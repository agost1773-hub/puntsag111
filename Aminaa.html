
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Уучлаарай, ❤️</title>
<style>
body {
    background: pink;
    text-align: center;
    font-family: Arial;
    padding-top: 100px;
}
.box {
    background: white;
    padding: 25px;
    margin: auto;
    width: 280px;
    border-radius: 20px;
}
h2 { color: #ff477e; }
p { line-height: 1.8; color: #555; }
button {
    background: #ff477e;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="box">
    <h2>Уучлаарай,  🥺❤️</h2>
    <p>
        Чамайгаа гомдоосондоо үнэхээр уучлаарай.
        Чамайг гомдоохыг хүсээгүй юм шүү.
        Миний буруу байсан бол уучлаарай.
        Дахиж ийм алдаа гаргахгүйг хичээнэ ээ.
    </p>
    <button onclick="alert('Намайг уучлаарай,  ❤️🥺')">
        Уучлаарай 💌
    </button>
</div>

</body>
</html>
